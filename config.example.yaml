# Copy this file to config.yaml and adjust to your homelab.
# config.yaml is gitignored — it's fine to put internal IPs/hostnames in it.

# Default refresh interval (seconds) for containers, host metrics and uptime checks.
refresh_interval: 5

# SQLite file backing the Security Events panel's history and triage state
# (acknowledged/new), resolved relative to this config file's directory.
# Gitignored, same as config.yaml — it's local runtime state.
events_db: "roost_events.db"

# Mouse support (click a row to open it) — on by default. Only turn this off
# on a legacy Windows console (conhost.exe, not Windows Terminal) that leaks
# raw mouse escape sequences as visible text instead of consuming them.
mouse: true

docker:
  enabled: true
  # Leave null to use the environment default (DOCKER_HOST env var, or the
  # local unix socket / npipe). To reach a remote daemon, prefer SSH over a
  # plain tcp:// URL — the latter exposes the Docker API unauthenticated on
  # the network. Requires passwordless SSH (a key, not a password) and the
  # `paramiko` package (already a dependency of this project):
  #   host: "ssh://user@192.168.1.10"
  host: null

host:
  enabled: true
  # Uncomment to collect CPU/RAM/disk/temperature from a remote machine over
  # SSH instead of the machine running the dashboard. `python` should point
  # at an interpreter on the remote machine that has psutil installed — e.g.
  # the venv this project was deployed with, if you set it up there too.
  # remote:
  #   ssh_target: "user@192.168.1.10"
  #   python: "~/roost/.venv/bin/python3"

uptime:
  enabled: true
  timeout: 3.0
  targets:
    - name: "Router"
      type: tcp
      address: 192.168.1.1
      port: 80
    - name: "Plex"
      type: http
      url: "http://192.168.1.50:32400/identity"
    - name: "Internet (Cloudflare DNS)"
      type: ping
      address: 1.1.1.1

network:
  enabled: true
  # CIDR range to sweep for live hosts.
  cidr: "192.168.1.0/24"
  scan_interval: 60
  timeout: 1.0
  # Max concurrent pings during a sweep.
  concurrency: 32

  # Exposure scan: TCP connect + banner grab against a fixed port list, run
  # against every host the sweep above just found. Ports historically common
  # as unauthenticated/legacy attack surface (telnet, SMB, RDP, VNC, Redis,
  # Elasticsearch, MongoDB, ...) are flagged in the UI — this is NOT a CVE
  # scanner, just "this deserves a second look".
  portscan:
    enabled: true
    # Runs less often than the ping sweep — it's much heavier (every host x
    # every port). New devices still get an early first scan on discovery.
    interval: 300
    timeout: 1.5
    # Max concurrent connection attempts across ALL hosts x ports combined.
    concurrency: 64
    # Uncomment to scan a custom port list instead of the built-in default
    # (ftp, ssh, telnet, http(s), smb, rdp, vnc, common databases, etc.):
    # ports: [22, 80, 443, 8080]

# Alerts from an OpenCanary honeypot (https://github.com/thinkst/opencanary) —
# or anything else that logs JSON lines with the same shape. Off by default:
# only turn this on once you've actually deployed a canary somewhere.
# A line counts as a real alert (not internal housekeeping) when it has a
# non-empty src_host — i.e. something actually connected to a decoy service.
# Canary hits land in the Security Events panel alongside network changes
# (new devices, newly-opened ports) — one triage-able, persistent log.
canary:
  enabled: false
  ssh_target: "user@192.168.1.10"
  log_path: "/var/tmp/opencanary.log"
  # How many of the most recent log lines to pull each cycle. If the log is
  # full of old restart/housekeeping noise, real alerts can end up further
  # back than this window — truncate the log after a fresh, stable start if
  # that happens, rather than setting this arbitrarily high.
  tail_lines: 200
  interval: 30
